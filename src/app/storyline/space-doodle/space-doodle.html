<div class="doodle" [class.peek]="showMessage()" (mouseenter)="showMessage.set(true)" (mouseleave)="dismiss()" (click)="peek()" aria-hidden="true">
  <svg viewBox="0 0 100 100" role="presentation" focusable="false">
    @switch (kind()) {
      @case ('planet') { <circle class="planet" cx="50" cy="50" r="24"/><ellipse class="ring" cx="50" cy="50" rx="42" ry="12" transform="rotate(-24 50 50)"/> <path class="shade" d="M40 28a24 24 0 0 0 15 44 24 24 0 0 1-15-44"/> }
      @case ('astronaut') { <circle class="helmet" cx="50" cy="34" r="22"/><rect class="visor" x="36" y="25" width="29" height="20" rx="10"/><path class="suit" d="M29 57q21-13 42 0l8 30H21z"/><path class="line" d="M43 66h14m-7-7v28"/> }
      @case ('satellite') { <rect class="body" x="38" y="37" width="24" height="26" rx="4"/><path class="panel" d="M5 34h27v32H5zm63 0h27v32H68z"/><path class="line" d="m50 37 8-19m-8 19-8-19m8 46 10 13"/><circle class="glow" cx="50" cy="49" r="5"/> }
      @case ('rocket') { <path class="rocket" d="M50 8c17 14 19 37 9 54l-9 12-9-12C31 45 33 22 50 8Z"/><circle class="window" cx="50" cy="35" r="7"/><path class="fin" d="m40 48-15 15 15-2m20-13 15 15-15-2"/><path class="flame" d="m43 72 7 18 7-18"/> }
      @case ('comet') { <path class="tail" d="M10 78 57 35"/><circle class="comet" cx="67" cy="28" r="17"/><path class="glint" d="m67 3 2 11m23 14-11 2M50 13l6 8"/> }
      @default { <path class="star" d="m50 5 12 29 31 3-24 20 7 31-26-17-26 17 7-31L7 37l31-3z"/> }
    }
  </svg>
  @if (showMessage()) { <span class="bubble">{{ message() }}</span> }
</div>
